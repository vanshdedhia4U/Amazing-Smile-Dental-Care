            '<button onclick="try{localStorage.clear();}catch(e){}location.reload();" style="background:#0f766e;color:#fff;border:none;padding:12px 24px;border-radius:10px;font-weight:600;font-size:14px;cursor:pointer;">Reset & Reload</button>' +
